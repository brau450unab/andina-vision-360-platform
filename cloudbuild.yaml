steps:
  # 0. Habilitar APIs y Servicios requeridos en Google Cloud Platform
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'services'
      - 'enable'
      - 'run.googleapis.com'
      - 'cloudbuild.googleapis.com'
      - 'containerregistry.googleapis.com'
      - 'artifactregistry.googleapis.com'

  # 1. Construir imagen Docker para la Plataforma Comercial 360° (Modo Claro)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/andina-vision-360-platform:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/andina-vision-360-platform:latest'
      - '.'

  # 2. Subir imagen a Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/andina-vision-360-platform:$COMMIT_SHA'

  # 3. Desplegar servicio independiente en Google Cloud Run (Puerto 8080)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'andina-vision-360-platform'
      - '--image'
      - 'gcr.io/$PROJECT_ID/andina-vision-360-platform:$COMMIT_SHA'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

  # 4. Asegurar permiso público de visualización IAM (allUsers -> roles/run.invoker)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'add-iam-policy-binding'
      - 'andina-vision-360-platform'
      - '--region=$_REGION'
      - '--member=allUsers'
      - '--role=roles/run.invoker'

substitutions:
  _REGION: 'us-west1'

images:
  - 'gcr.io/$PROJECT_ID/andina-vision-360-platform:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
