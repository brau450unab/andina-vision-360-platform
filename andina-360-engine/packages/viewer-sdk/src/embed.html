<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Andina Vision 360 - Visor Inmersivo</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0f19;
    }
    #viewer-root {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="viewer-root"></div>

  <script type="module">
    import { Andina360Viewer } from './viewer.js';

    const urlParams = new URLSearchParams(window.location.search);
    const tourId = urlParams.get('tourId') || 'tour_demo';
    const apiBase = urlParams.get('api') || 'http://localhost:8080/api/v1';

    const viewer = new Andina360Viewer('#viewer-root');

    async function init() {
      try {
        const res = await fetch(`${apiBase}/embed/${tourId}`);
        if (res.ok) {
          const tourData = await res.json();
          viewer.loadTour(tourData);
          return;
        }
      } catch (e) {
        console.warn("API remota no disponible, cargando tour demo local.");
      }

      const demoTour = {
        id: "tour_demo",
        title: "Andina Vision - Vista Aérea Valle Cordillerano",
        allowGyroscope: true,
        firstSceneId: "scene_01",
        scenes: [
          {
            id: "scene_01",
            title: "Toma General Dron DJI (Cota 1200m)",
            preview_url: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=2048&q=80",
            default_yaw: 0,
            default_pitch: -10,
            hotspots: [
              {
                id: "h1",
                type: "scene_link",
                yaw: 45,
                pitch: -5,
                tooltip: "Aproximarse a la Casona Central",
                target_scene_id: "scene_02"
              },
              {
                id: "h2",
                type: "info_popup",
                yaw: -60,
                pitch: 5,
                title: "Proyecto Cordillera y Vuelo 360",
                description: "Demostración de video 360 con orientación de giroscopio y ficha técnica en Google Drive.",
                youtube_video_id: "dQw4w9WgXcQ",
                drive_url: "https://drive.google.com",
                drive_label: "Abrir carpeta en Google Drive"
              }
            ]
          },
          {
            id: "scene_02",
            title: "Casona Principal - Vista Frontal",
            preview_url: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=2048&q=80",
            default_yaw: 180,
            default_pitch: 0,
            hotspots: [
              {
                id: "h3",
                type: "scene_link",
                yaw: 180,
                pitch: 10,
                tooltip: "Regresar a Vista Aérea",
                target_scene_id: "scene_01"
              }
            ]
          }
        ]
      };

      viewer.loadTour(demoTour);
    }

    init();
  </script>
</body>
</html>
